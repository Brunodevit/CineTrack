    </header>
    <script>

        document.getElementById("btnenterdeskid").addEventListener('click', function () {

            document.getElementById("btnenterdeskid").addEventListener('click', function () {
                let nome = document.getElementById("inputdesk").value;

                // Requisição fetch para buscar o filme pela API
                fetch(`http://localhost:3000/items?titulo=${nome}`)
                    .then(response => response.json())  // Converte a resposta para JSON
                    .then(filmes => {
                        if (filmes.length > 0) {  // Se o filme for encontrado
                            let filme = filmes[0];  // Considera o primeiro filme encontrado
                            dados.filme = filme;
                            document.getElementById("buttonfilme").setAttribute("href", `detalhes.html?id=${dados.filme.id}`);
                        } else {
                            console.log("Filme não encontrado");
                        }
                    })
                    .catch(error => {
                        console.error("Erro ao buscar filme:", error);
                    });
            });


        })

    </script>


    <div id="topo">

  <div class="container my-5">
  <h2 class="text-center text-primary mb-4" style="font-weight: 700; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    Distribuição de Filmes por Gênero
  </h2>
  <div class="d-flex justify-content-center">
    <canvas id="graficoGenero" style="max-width: 400px; max-height: 400px;"></canvas>
  </div>
</div>

<!-- CSS extra para suavizar borda e sombra do canvas -->
<style>
  #graficoGenero {
    background: #f9fafb;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    padding: 20px;
  }
</style>

<!-- Script do gráfico -->
<script>
  fetch('http://localhost:3000/items')
    .then(res => res.json())
    .then(dados => {
      const contagemGenero = {};

      dados.forEach(item => {
        const genero = item.tipo.toLowerCase();
        contagemGenero[genero] = (contagemGenero[genero] || 0) + 1;
      });

      const generos = Object.keys(contagemGenero);
      const quantidades = Object.values(contagemGenero);
      const cores = ['#3b82f6', '#10b981', '#f97316', '#f43f5e', '#8b5cf6', '#14b8a6'];

      new Chart(document.getElementById('graficoGenero'), {
        type: 'pie',
        data: {
          labels: generos,
          datasets: [{
            label: 'Distribuição por Gênero',
            data: quantidades,
            backgroundColor: cores.slice(0, generos.length),
            borderColor: '#fff',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#1e40af',
                font: { weight: 'bold', size: 14 }
              }
            },
            title: {
              display: false
            },
            tooltip: {
              enabled: true,
              callbacks: {
                label: function(context) {
                  let label = context.label || '';
                  let value = context.parsed || 0;
                  return `${label}: ${value} filme(s)`;
                }
              }
            }
          }
        }
      });
    })
    .catch(err => console.error("Erro ao buscar dados:", err));
</script>
